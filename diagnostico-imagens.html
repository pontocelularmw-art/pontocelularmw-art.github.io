<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico de imagens — Ponto Celular</title>
<style>
body{font-family:Arial,sans-serif;background:#0a0c16;color:#f5f6fa;padding:24px}
h1{font-size:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
figure{margin:0;padding:14px;border:1px solid #272c48;border-radius:14px;background:#111426}
img{width:100%;height:160px;object-fit:contain;background:#fff;border-radius:10px}
figcaption{font-size:12px;margin-top:9px;word-break:break-all}
.ok{color:#65d996}.fail{color:#ff626c}
</style>



<!-- FAVICONS PONTO CELULAR — desktop, Android, Safari e iOS -->
<link rel="icon" href="./favicon.ico?v=20260901-final" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="./imagens/favicon-16x16.png?v=20260901-final">
<link rel="icon" type="image/png" sizes="32x32" href="./imagens/favicon-32x32.png?v=20260901-final">
<link rel="icon" type="image/png" sizes="48x48" href="./imagens/favicon-48x48.png?v=20260901-final">
<link rel="shortcut icon" href="./favicon.ico?v=20260901-final">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20260901-final">
<link rel="manifest" href="./site.webmanifest?v=20260901-final">
<meta name="theme-color" content="#060390">
<meta name="application-name" content="Ponto Celular">

<body>
